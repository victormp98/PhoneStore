services:
  phonestore-postgres:
    image: postgres:16
    container_name: phonestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phonestore_db
      POSTGRES_USER: phonestore_user
      POSTGRES_PASSWORD: ${PHONESTORE_DB_PASSWORD:?Set PHONESTORE_DB_PASSWORD in your local environment}
    ports:
      - "5434:5432"
    volumes:
      - phonestore_postgres_data:/var/lib/postgresql/data

volumes:
  phonestore_postgres_data:
